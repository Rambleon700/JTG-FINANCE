<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JTG Portfolio Tracker</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23003153'/><text x='50%' y='65%' font-family='Arial, sans-serif' font-weight='900' font-size='42' fill='%23FFFFFF' text-anchor='middle'>JTG</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #1a202c;
            --border-color: #e2e8f0;
            --prussian-blue: #003153;
            --prussian-blue-hover: #00223d;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --subtext: #64748b;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --prussian-blue: #1e40af;
            --prussian-blue-hover: #1d4ed8;
            --subtext: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; padding: 20px; }
        
        .container { max-width: 1240px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--border-color); }
        .logo-title { display: flex; align-items: center; gap: 12px; }
        .logo-badge { background: #003153; color: white; padding: 6px 12px; border-radius: 8px; font-weight: 900; letter-spacing: 1px; }
        
        .controls { display: flex; gap: 10px; }
        button { background-color: var(--prussian-blue); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
        .btn-action { padding: 4px 8px; font-size: 0.8rem; margin-right: 4px; }
        .btn-edit { background-color: #3b82f6; }
        .btn-save { background-color: var(--accent-green); }
        .btn-danger { background-color: var(--accent-red); }

        .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--card-bg); padding: 18px; border-radius: 10px; border: 1px solid var(--border-color); }
        .card-title { font-size: 0.85rem; color: var(--subtext); text-transform: uppercase; font-weight: 700; }
        .card-value { font-size: 1.5rem; font-weight: 700; margin-top: 8px; }
        
        .add-ticker-card { background: var(--card-bg); padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 24px; }
        .add-ticker-form { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .add-ticker-form input { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color); flex: 1; min-width: 110px; }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        .charts-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media(max-width: 900px) { .charts-container { grid-template-columns: 1fr; } }
        
        .table-container { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); overflow-x: auto; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(0,0,0,0.02); font-size: 0.85rem; color: var(--subtext); text-transform: uppercase; }
        
        input[type="number"], input[type="text"].inline-input, input[type="date"].inline-input { width: 100%; max-width: 120px; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--card-bg); color: var(--text-color); }
        
        .json-controls { display: flex; justify-content: flex-end; gap: 10px; }
        .action-cell { white-space: nowrap; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-title">
            <span class="logo-badge">JTG</span>
            <h2>Portfolio Tracker</h2>
        </div>
        <div class="controls">
            <button onclick="refreshPrices()">🔄 Refresh Prices</button>
            <button class="btn-secondary" onclick="resetDefaultPortfolio()">🗑️ Reset Portfolio</button>
            <button class="btn-secondary" onclick="toggleTheme()">🌓 Theme</button>
        </div>
    </header>

    <div class="summary-cards">
        <div class="card">
            <div class="card-title">Total Portfolio Value</div>
            <div class="card-value" id="total-val">£0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Total Book Cost</div>
            <div class="card-value" id="total-cost">£0.00</div>
        </div>
        <div class="card">
            <div class="card-title">Total Return</div>
            <div class="card-value" id="total-return">£0.00 (0.00%)</div>
        </div>
    </div>

    <div class="add-ticker-card">
        <div class="card-title">Add New Ticker</div>
        <form class="add-ticker-form" onsubmit="addTicker(event)">
            <input type="text" id="new-ticker" placeholder="Ticker (e.g. TSLA)" required>
            <input type="text" id="new-name" placeholder="Asset Name" required>
            <input type="date" id="new-date" required>
            <input type="number" step="any" id="new-units" placeholder="Units Held" required>
            <input type="number" step="any" id="new-cost" placeholder="Book Cost (£)" required>
            <input type="number" step="any" id="new-price" placeholder="Current Price (£)" required>
            <button type="submit">➕ Add Asset</button>
        </form>
    </div>

    <div class="charts-container">
        <div class="card">
            <div class="card-title" style="margin-bottom: 12px;">Portfolio Timeline Performance</div>
            <canvas id="historyChart" height="120"></canvas>
        </div>
        <div class="card">
            <div class="card-title" style="margin-bottom: 12px;">Asset Allocation</div>
            <canvas id="allocationChart"></canvas>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Name</th>
                    <th>Bought Date</th>
                    <th>Units Held</th>
                    <th>Book Cost (£)</th>
                    <th>Current Price (£)</th>
                    <th>Current Value (£)</th>
                    <th>P/L (£)</th>
                    <th>P/L (%)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="portfolio-body"></tbody>
        </table>
    </div>

    <div class="json-controls">
        <button class="btn-secondary" onclick="exportJSON()">📥 Export JSON</button>
        <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Import JSON</button>
        <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
</div>

<script>
    const defaultHoldings = [
        { ticker: 'OP00018XAR.L', name: 'Vanguard FTSE Global All Cap (Acc)', boughtDate: '2023-01-15', units: 100, bookCost: 21000, price: 300.3348, isEditing: false },
        { ticker: 'GB00BMJJJF91', name: 'HSBC FTSE All World Index C Acc', boughtDate: '2023-03-10', units: 2500, bookCost: 10000, price: 4.1400, isEditing: false },
        { ticker: 'VWRP.AQ', name: 'Vanguard FTSE All-World ETF', boughtDate: '2023-06-01', units: 150, bookCost: 19000, price: 156.4177, isEditing: false },
        { ticker: 'OP00013P6I.L', name: 'Vanguard Global Small-Cap Index', boughtDate: '2023-09-20', units: 80, bookCost: 28000, price: 396.4238, isEditing: false },
        { ticker: 'SSITL.XC', name: 'Seraphim Space Investment Trust', boughtDate: '2024-01-10', units: 2500, bookCost: 1800, price: 0.6619, isEditing: false },
        { ticker: 'IES.L', name: 'Invinity Energy Systems', boughtDate: '2024-04-12', units: 4000, bookCost: 1200, price: 0.2828, isEditing: false },
        { ticker: 'LLOY.L', name: 'Lloyds Banking Group', boughtDate: '2023-01-05', units: 10000, bookCost: 4500, price: 1.0995, isEditing: false },
        { ticker: 'MIRI.L', name: 'Ilika plc', boughtDate: '2024-08-01', units: 3000, bookCost: 1500, price: 0.2635, isEditing: false }
    ];

    // Estimated historical growth factors relative to current price to simulate past performance dynamically
    const growthFactors = {
        '2023-Q1': 0.72,
        '2023-Q2': 0.76,
        '2023-Q3': 0.79,
        '2023-Q4': 0.83,
        '2024-Q1': 0.87,
        '2024-Q2': 0.91,
        '2024-Q3': 0.95,
        '2024-Q4': 0.98,
        '2025-Q1': 1.01,
        '2025-Q2': 1.04,
        '2025-Q3': 1.08,
        '2025-Q4': 1.11,
        '2026-Q1': 1.14,
        '2026-Q2': 1.17,
        '2026-Q3': 1.20
    };

    let holdings = JSON.parse(localStorage.getItem('jtg_portfolio')) || defaultHoldings;

    let historyChart, allocationChart;

    const chartColors = [
        '#003153', '#005086', '#3374A6', '#6698C7', '#99BCE8', 
        '#10B981', '#6366F1', '#F59E0B', '#EC4899', '#8B5CF6'
    ];

    function calculateDynamicHistory() {
        const timelineKeys = Object.keys(growthFactors);
        
        // Find earliest purchase date in portfolio
        const dates = holdings.map(h => h.boughtDate).filter(Boolean);
        const earliestDate = dates.length > 0 ? dates.reduce((a, b) => a < b ? a : b) : '2023-01-01';
        const earliestYear = parseInt(earliestDate.substring(0, 4));

        // Filter chart timeline to only start from earliest purchase period
        const activeKeys = timelineKeys.filter(key => {
            const keyYear = parseInt(key.substring(0, 4));
            return keyYear >= earliestYear;
        });

        const values = activeKeys.map(key => {
            let totalPeriodVal = 0;
            const periodYear = parseInt(key.substring(0, 4));
            const periodQuarter = parseInt(key.substring(6, 7));
            const periodApproxDate = new Date(periodYear, (periodQuarter - 1) * 3, 1);

            holdings.forEach(item => {
                const bought = new Date(item.boughtDate || '2023-01-01');
                // Include in point total ONLY if purchased prior or during this point in time
                if (bought <= periodApproxDate) {
                    const factor = growthFactors[key] || 1;
                    totalPeriodVal += (item.units * item.price) * (factor / 1.20);
                }
            });

            return Math.round(totalPeriodVal);
        });

        return { labels: activeKeys, values: values };
    }

    function initCharts() {
        const histData = calculateDynamicHistory();
        const histCtx = document.getElementById('historyChart').getContext('2d');
        historyChart = new Chart(histCtx, {
            type: 'line',
            data: {
                labels: histData.labels,
                datasets: [{
                    label: 'Portfolio Value (£)',
                    data: histData.values,
                    borderColor: '#003153',
                    backgroundColor: 'rgba(0, 49, 83, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });

        const allocCtx = document.getElementById('allocationChart').getContext('2d');
        allocationChart = new Chart(allocCtx, {
            type: 'doughnut',
            data: {
                labels: holdings.map(h => h.ticker),
                datasets: [{
                    data: holdings.map(h => h.units * h.price),
                    backgroundColor: chartColors.slice(0, holdings.length)
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }

    function renderTable() {
        const tbody = document.getElementById('portfolio-body');
        tbody.innerHTML = '';

        let totalValue = 0;
        let totalCost = 0;

        holdings.forEach((item, index) => {
            const currentValue = item.units * item.price;
            const pnl = currentValue - item.bookCost;
            const pnlPercent = item.bookCost > 0 ? (pnl / item.bookCost) * 100 : 0;

            totalValue += currentValue;
            totalCost += item.bookCost;

            const row = document.createElement('tr');
            
            if (item.isEditing) {
                row.innerHTML = `
                    <td><input type="text" class="inline-input" id="edit-ticker-${index}" value="${item.ticker}"></td>
                    <td><input type="text" class="inline-input" id="edit-name-${index}" value="${item.name}"></td>
                    <td><input type="date" class="inline-input" id="edit-date-${index}" value="${item.boughtDate || ''}"></td>
                    <td><input type="number" step="any" value="${item.units}" onchange="updateHolding(${index}, 'units', this.value)"></td>
                    <td><input type="number" step="any" value="${item.bookCost}" onchange="updateHolding(${index}, 'bookCost', this.value)"></td>
                    <td>£<input type="number" step="any" class="inline-input" style="width:80px" value="${item.price}" onchange="updateHolding(${index}, 'price', this.value)"></td>
                    <td>£${currentValue.toFixed(2)}</td>
                    <td class="${pnl >= 0 ? 'positive' : 'negative'}">£${pnl.toFixed(2)}</td>
                    <td class="${pnl >= 0 ? 'positive' : 'negative'}">${pnlPercent.toFixed(2)}%</td>
                    <td class="action-cell">
                        <button class="btn-action btn-save" onclick="saveTickerEdit(${index})">💾 Save</button>
                        <button class="btn-action btn-danger" onclick="deleteTicker(${index})">🗑️</button>
                    </td>
                `;
            } else {
                row.innerHTML = `
                    <td><strong>${item.ticker}</strong></td>
                    <td>${item.name}</td>
                    <td>${item.boughtDate || 'N/A'}</td>
                    <td><input type="number" step="any" value="${item.units}" onchange="updateHolding(${index}, 'units', this.value)"></td>
                    <td><input type="number" step="any" value="${item.bookCost}" onchange="updateHolding(${index}, 'bookCost', this.value)"></td>
                    <td>£${item.price.toFixed(4)}</td>
                    <td>£${currentValue.toFixed(2)}</td>
                    <td class="${pnl >= 0 ? 'positive' : 'negative'}">£${pnl.toFixed(2)}</td>
                    <td class="${pnl >= 0 ? 'positive' : 'negative'}">${pnlPercent.toFixed(2)}%</td>
                    <td class="action-cell">
                        <button class="btn-action btn-edit" onclick="toggleEdit(${index})">✏️ Edit</button>
                        <button class="btn-action btn-danger" onclick="deleteTicker(${index})">🗑️</button>
                    </td>
                `;
            }
            tbody.appendChild(row);
        });

        const totalReturn = totalValue - totalCost;
        const totalReturnPercent = totalCost > 0 ? (totalReturn / totalCost) * 100 : 0;

        document.getElementById('total-val').innerText = `£${totalValue.toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('total-cost').innerText = `£${totalCost.toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        
        const returnElem = document.getElementById('total-return');
        returnElem.innerText = `£${totalReturn.toFixed(2)} (${totalReturnPercent.toFixed(2)}%)`;
        returnElem.className = `card-value ${totalReturn >= 0 ? 'positive' : 'negative'}`;

        saveData();
        updateCharts();
    }

    function toggleEdit(index) {
        holdings[index].isEditing = true;
        renderTable();
    }

    function saveTickerEdit(index) {
        const newTicker = document.getElementById(`edit-ticker-${index}`).value.trim().toUpperCase();
        const newName = document.getElementById(`edit-name-${index}`).value.trim();
        const newDate = document.getElementById(`edit-date-${index}`).value;
        
        if (newTicker && newName) {
            holdings[index].ticker = newTicker;
            holdings[index].name = newName;
            holdings[index].boughtDate = newDate;
            holdings[index].isEditing = false;
            renderTable();
        } else {
            alert("Ticker and Name fields cannot be empty.");
        }
    }

    function addTicker(event) {
        event.preventDefault();
        const ticker = document.getElementById('new-ticker').value.toUpperCase().trim();
        const name = document.getElementById('new-name').value.trim();
        const boughtDate = document.getElementById('new-date').value;
        const units = parseFloat(document.getElementById('new-units').value) || 0;
        const bookCost = parseFloat(document.getElementById('new-cost').value) || 0;
        const price = parseFloat(document.getElementById('new-price').value) || 0;

        holdings.push({ ticker, name, boughtDate, units, bookCost, price, isEditing: false });
        event.target.reset();
        renderTable();
    }

    function deleteTicker(index) {
        if (confirm(`Are you sure you want to remove ${holdings[index].ticker}?`)) {
            holdings.splice(index, 1);
            renderTable();
        }
    }

    function updateHolding(index, field, value) {
        holdings[index][field] = parseFloat(value) || 0;
        renderTable();
    }

    function updateCharts() {
        if (allocationChart) {
            allocationChart.data.labels = holdings.map(h => h.ticker);
            allocationChart.data.datasets[0].data = holdings.map(h => h.units * h.price);
            allocationChart.data.datasets[0].backgroundColor = chartColors.slice(0, holdings.length);
            allocationChart.update();
        }

        if (historyChart) {
            const histData = calculateDynamicHistory();
            historyChart.data.labels = histData.labels;
            historyChart.data.datasets[0].data = histData.values;
            historyChart.update();
        }
    }

    function refreshPrices() {
        holdings.forEach(item => {
            const fluctuation = (Math.random() - 0.48) * 0.02;
            item.price = Math.max(0.01, item.price * (1 + fluctuation));
        });
        renderTable();
    }

    function resetDefaultPortfolio() {
        if (confirm("Reset portfolio back to default values?")) {
            localStorage.removeItem('jtg_portfolio');
            holdings = JSON.parse(JSON.stringify(defaultHoldings));
            renderTable();
        }
    }

    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
    }

    function saveData() {
        const cleanHoldings = holdings.map(({ isEditing, ...rest }) => rest);
        localStorage.setItem('jtg_portfolio', JSON.stringify(cleanHoldings));
    }

    function exportJSON() {
        const cleanHoldings = holdings.map(({ isEditing, ...rest }) => rest);
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanHoldings, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "jtg_portfolio.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importJSON(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    holdings = importedData.map(item => ({ ...item, isEditing: false }));
                    renderTable();
                } else {
                    alert("Invalid JSON structure.");
                }
            } catch (err) {
                alert("Error reading JSON file.");
            }
        };
        reader.readAsText(event.target.files[0]);
    }

    window.onload = () => {
        initCharts();
        renderTable();
    };
</script>
</body>
</html>
