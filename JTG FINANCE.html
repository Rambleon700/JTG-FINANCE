<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
    .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
    input, select, button { padding: 8px; font-size: 14px; }
    button { background: #0066cc; color: white; border: none; cursor: pointer; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .positive { color: green; font-weight: bold; }
    .negative { color: red; font-weight: bold; }
    .chart-container { margin-top: 30px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Daily Portfolio Tracker</h2>
  
  <div class="grid">
    <input type="text" id="symbol" placeholder="Ticker (e.g., AAPL, VOO)" required>
    <select id="type">
      <option value="Share">Share</option>
      <option value="ETF">ETF</option>
      <option value="Crypto">Crypto</option>
    </select>
    <input type="number" id="shares" placeholder="Quantity Purchased" step="any" required>
    <input type="number" id="buyPrice" placeholder="Buy Price ($)" step="any" required>
  </div>
  <div class="grid">
    <input type="number" id="currentPrice" placeholder="Current Price ($)" step="any" required>
    <input type="number" id="prevClose" placeholder="Prev Close Price ($)" step="any" required>
    <button onclick="addAsset()" style="grid-column: span 2;">Add Asset</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Asset</th>
        <th>Qty</th>
        <th>Book Cost</th>
        <th>Current Value</th>
        <th>Daily Gain/Loss</th>
        <th>Total Gain/Loss (%)</th>
      </tr>
    </thead>
    <tbody id="portfolioTable"></tbody>
  </table>

  <div style="margin-top: 15px; font-size: 16px;">
    <strong>Total Book Cost:</strong> $<span id="totalBookCost">0.00</span> | 
    <strong>Total Value:</strong> $<span id="totalValue">0.00</span> | 
    <strong>Overall Return:</strong> <span id="totalReturn">0.00%</span>
  </div>

  <div class="chart-container">
    <canvas id="portfolioChart"></canvas>
  </div>
</div>

<script>
  let portfolio = [];
  let chart;

  function addAsset() {
    const symbol = document.getElementById('symbol').value.toUpperCase();
    const type = document.getElementById('type').value;
    const shares = parseFloat(document.getElementById('shares').value);
    const buyPrice = parseFloat(document.getElementById('buyPrice').value);
    const currentPrice = parseFloat(document.getElementById('currentPrice').value);
    const prevClose = parseFloat(document.getElementById('prevClose').value);

    if (!symbol || isNaN(shares) || isNaN(buyPrice) || isNaN(currentPrice) || isNaN(prevClose)) {
      alert("Please fill in all fields with valid numbers.");
      return;
    }

    const bookCost = shares * buyPrice;
    const currentValue = shares * currentPrice;
    const dailyPnl = (currentPrice - prevClose) * shares;
    const totalPnl = currentValue - bookCost;
    const totalPnlPercent = ((totalPnl / bookCost) * 100).toFixed(2);

    portfolio.push({
      symbol, type, shares, buyPrice, currentPrice, prevClose,
      bookCost, currentValue, dailyPnl, totalPnl, totalPnlPercent
    });

    updateUI();
    clearInputs();
  }

  function updateUI() {
    const tableBody = document.getElementById('portfolioTable');
    tableBody.innerHTML = '';

    let sumBookCost = 0;
    let sumCurrentValue = 0;

    portfolio.forEach(item => {
      sumBookCost += item.bookCost;
      sumCurrentValue += item.currentValue;

      const dailyClass = item.dailyPnl >= 0 ? 'positive' : 'negative';
      const totalClass = item.totalPnl >= 0 ? 'positive' : 'negative';

      const row = `<tr>
        <td><strong>${item.symbol}</strong> <small>(${item.type})</small></td>
        <td>${item.shares}</td>
        <td>$${item.bookCost.toFixed(2)}</td>
        <td>$${item.currentValue.toFixed(2)}</td>
        <td class="${dailyClass}">$${item.dailyPnl.toFixed(2)}</td>
        <td class="${totalClass}">${item.totalPnlPercent}% ($${item.totalPnl.toFixed(2)})</td>
      </tr>`;
      tableBody.innerHTML += row;
    });

    const totalReturnPct = sumBookCost > 0 ? (((sumCurrentValue - sumBookCost) / sumBookCost) * 100).toFixed(2) : "0.00";
    
    document.getElementById('totalBookCost').innerText = sumBookCost.toFixed(2);
    document.getElementById('totalValue').innerText = sumCurrentValue.toFixed(2);
    
    const returnEl = document.getElementById('totalReturn');
    returnEl.innerText = `${totalReturnPct}%`;
    returnEl.className = totalReturnPct >= 0 ? 'positive' : 'negative';

    renderChart(sumCurrentValue);
  }

  function renderChart(totalVal) {
    const labels = portfolio.map(item => item.symbol);
    const individualValues = portfolio.map(item => item.currentValue);

    if (chart) chart.destroy();

    const ctx = document.getElementById('portfolioChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Asset Current Value ($)',
          data: individualValues,
          backgroundColor: '#0066cc'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: `Individual Breakdown (Total Portfolio Value: $${totalVal.toFixed(2)})`
          }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  function clearInputs() {
    document.getElementById('symbol').value = '';
    document.getElementById('shares').value = '';
    document.getElementById('buyPrice').value = '';
    document.getElementById('currentPrice').value = '';
    document.getElementById('prevClose').value = '';
  }
</script>

</body>
</html>
